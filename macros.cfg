[gcode_macro PRINT_START]
gcode:  
  G21 ; set units to mm
  G90 ; absolute positioning
  M82 ; absolute extruder
  G28 ; home all axes
  G0 X0 Y0 Z20 F3000 ; Move to center
  M104 S170 ; preheat extruder
  M190 S{params.BED|int} ; heat bed and wait
  delta_calibrate
  M109 S{params.EXTRUDER|int} ; heat extruder and wait
  G1 F3000 Z1 ; move printhead
  G1 X-125 Y0 Z0.4 ; move to prime start
  M107 T0 ; fan off
  G92 E0 ; reset extruder position
  G3 X0 Y-125 I125 Z0.3 E30 F2000 ; prime arc
  G92 E0 ; reset extruder position
  SET_TMC_CURRENT STEPPER=extruder CURRENT=0.8


[gcode_macro PRINT_END]
gcode:
  M400 ; wait for buffer to clear
  G92 E0 ; zero the extruder
  G1 E-5 F2000 ; retract
  G90 ; relative positioning
  G0 X0 Y0 Z330 ; move toolhead to top
  M107 T0 ; turn off fan
  M104 S0 ; turn off hotend
  M104 S0 T1
  M140 S0 ; turn off bed
  G92 E0
  G91
  G1 Z+0.5  F6000
  G28 
  G90 ;absolute positioning
  TIMELAPSE_RENDER